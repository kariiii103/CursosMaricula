services:
  fcbdb:
    image: mysql:9.7
    container_name: fcbdb
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: db_matricula
    ports:
      - 3307:3306
    volumes:
      - ./db_dump:/docker-entrypoint-initdb.d
      - ./mysql:/var/lib/mysql
    secrets:
      - db_password

  fcbdatos:
    container_name: fcbdatos
    build:
      context: .
      dockerfile: ./Data/Dockerfile
    volumes:
      - ./Data/public:/var/www/html/public
      - ./Data/src:/var/www/html/src
    secrets:
      - db_password
    depends_on:
      - fcbdb

  ksvnegocio:
    container_name: fcbnegocio
    build:
      context: .
      dockerfile: ./Business/Dockerfile
    volumes:
      - ./Business/public:/var/www/html/public
      - ./Business/src:/var/www/html/src
    ports:
      - 9090:80
    depends_on:
      - fcbdatos

secrets:
  db_password:
    file: ./db_password.txt
